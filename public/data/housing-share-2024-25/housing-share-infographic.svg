<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc"><title id="title">Fewer homes. A bigger share.</title><desc id="desc">England net additions fell 5.8% between 2023/24 and 2024/25. South East, London and East of England additions fell 5.7%, so their combined share rose by 0.06 percentage points.</desc><rect x="0" y="0" width="1200" height="1800" fill="#F7F4ED"/><rect x="0" y="0" width="1200" height="16" fill="#B38834"/><text x="70" y="53" dominant-baseline="text-before-edge" font-family="Arial" font-size="27" font-weight="700" fill="#132D46">CONSTRUCTION CAPITAL</text><text x="734" y="57" dominant-baseline="text-before-edge" font-family="Arial" font-size="21" font-weight="400" fill="#496075">HOUSING DATA, EXPLAINED</text><text x="70" y="124" dominant-baseline="text-before-edge" font-family="Georgia" font-size="84" font-weight="700" fill="#132D46">Fewer homes.</text><text x="70" y="220" dominant-baseline="text-before-edge" font-family="Georgia" font-size="84" font-weight="700" fill="#132D46">A bigger share.</text><text x="70" y="331" dominant-baseline="text-before-edge" font-family="Arial" font-size="33" font-weight="400" fill="#132D46">How three regions gained a little national share</text><text x="70" y="378" dominant-baseline="text-before-edge" font-family="Arial" font-size="33" font-weight="400" fill="#132D46">even as their combined housing additions fell.</text><rect x="70" y="444" width="1060" height="74" fill="#132D46"/><text x="96" y="465" dominant-baseline="text-before-edge" font-family="Arial" font-size="27" font-weight="700" fill="white">ENGLAND  •  2023/24 TO 2024/25</text><text x="70" y="559" dominant-baseline="text-before-edge" font-family="Arial" font-size="25" font-weight="700" fill="#B38834">01</text><text x="134" y="552" dominant-baseline="text-before-edge" font-family="Arial" font-size="34" font-weight="700" fill="#132D46">Output fell in both comparisons</text><text x="70" y="607" dominant-baseline="text-before-edge" font-family="Arial" font-size="23" font-weight="400" fill="#496075">Net additional dwellings. All bars use the same zero baseline and scale.</text><text x="70" y="664" dominant-baseline="text-before-edge" font-family="Arial" font-size="29" font-weight="700" fill="#132D46">England</text><text x="70" y="727" dominant-baseline="text-before-edge" font-family="Arial" font-size="26" font-weight="400" fill="#496075">2023/24</text><rect x="240" y="719" width="619.9452" height="42" fill="#132D46"/><text x="873.9452" y="726" dominant-baseline="text-before-edge" font-family="Arial" font-size="27" font-weight="700" fill="#132D46">221,409</text><text x="70" y="791" dominant-baseline="text-before-edge" font-family="Arial" font-size="26" font-weight="400" fill="#496075">2024/25</text><rect x="240" y="783" width="584.08" height="42" fill="#132D46"/><text x="838.08" y="790" dominant-baseline="text-before-edge" font-family="Arial" font-size="27" font-weight="700" fill="#132D46">208,600</text><text x="760" y="664" dominant-baseline="text-before-edge" font-family="Arial" font-size="25" font-weight="700" fill="#A84438">-5.8% year on year</text><text x="70" y="891" dominant-baseline="text-before-edge" font-family="Arial" font-size="29" font-weight="700" fill="#132D46">South East + London + East of England</text><text x="70" y="954" dominant-baseline="text-before-edge" font-family="Arial" font-size="26" font-weight="400" fill="#496075">2023/24</text><rect x="240" y="946" width="277.69" height="42" fill="#087D83"/><text x="531.69" y="953" dominant-baseline="text-before-edge" font-family="Arial" font-size="27" font-weight="700" fill="#132D46">99,175</text><text x="70" y="1018" dominant-baseline="text-before-edge" font-family="Arial" font-size="26" font-weight="400" fill="#496075">2024/25</text><rect x="240" y="1010" width="261.97360000000003" height="42" fill="#087D83"/><text x="515.9736" y="1017" dominant-baseline="text-before-edge" font-family="Arial" font-size="27" font-weight="700" fill="#132D46">93,562</text><text x="760" y="891" dominant-baseline="text-before-edge" font-family="Arial" font-size="25" font-weight="700" fill="#A84438">-5.7% year on year</text><text x="233" y="1097" dominant-baseline="text-before-edge" font-family="Arial" font-size="19" font-weight="400" fill="#496075">0</text><text x="555.0" y="1097" dominant-baseline="text-before-edge" font-family="Arial" font-size="19" font-weight="400" fill="#496075">125,000</text><text x="905" y="1097" dominant-baseline="text-before-edge" font-family="Arial" font-size="19" font-weight="400" fill="#496075">250,000</text><rect x="240" y="1084" width="700" height="1" fill="#D5DDD9"/><rect x="70" y="1146" width="1060" height="2" fill="#D5DDD9"/><text x="70" y="1186" dominant-baseline="text-before-edge" font-family="Arial" font-size="25" font-weight="700" fill="#B38834">02</text><text x="134" y="1179" dominant-baseline="text-before-edge" font-family="Arial" font-size="34" font-weight="700" fill="#132D46">Their national share edged up</text><text x="70" y="1245" dominant-baseline="text-before-edge" font-family="Arial" font-size="74" font-weight="700" fill="#087D83">44.79%</text><text x="444" y="1254" dominant-baseline="text-before-edge" font-family="Arial" font-size="62" font-weight="400" fill="#496075">→</text><text x="586" y="1245" dominant-baseline="text-before-edge" font-family="Arial" font-size="74" font-weight="700" fill="#087D83">44.85%</text><text x="74" y="1332" dominant-baseline="text-before-edge" font-family="Arial" font-size="23" font-weight="400" fill="#496075">2023/24</text><text x="590" y="1332" dominant-baseline="text-before-edge" font-family="Arial" font-size="23" font-weight="400" fill="#496075">2024/25</text><text x="70" y="1391" dominant-baseline="text-before-edge" font-family="Arial" font-size="31" font-weight="700" fill="#132D46">+0.06 percentage points</text><text x="70" y="1443" dominant-baseline="text-before-edge" font-family="Arial" font-size="27" font-weight="400" fill="#132D46">England’s total fell slightly faster than the group’s total.</text><text x="70" y="1487" dominant-baseline="text-before-edge" font-family="Arial" font-size="27" font-weight="400" fill="#132D46">A rising share alone does not mean more homes were added.</text><rect x="70" y="1551" width="1060" height="2" fill="#D5DDD9"/><text x="70" y="1584" dominant-baseline="text-before-edge" font-family="Arial" font-size="24" font-weight="700" fill="#132D46">Source: MHCLG Live Table 118, 20 November 2025 edition.</text><text x="70" y="1625" dominant-baseline="text-before-edge" font-family="Arial" font-size="23" font-weight="400" fill="#496075">2023/24 revised; 2024/25 provisional. Net additions include new</text><text x="70" y="1662" dominant-baseline="text-before-edge" font-family="Arial" font-size="23" font-weight="400" fill="#496075">building and other gains, less losses. Shares use unrounded counts.</text><text x="70" y="1719" dominant-baseline="text-before-edge" font-family="Arial" font-size="22" font-weight="400" fill="#132D46">Matt Lenzie  |  Construction Capital  |  25 September 2026</text><text x="70" y="1758" dominant-baseline="text-before-edge" font-family="Arial" font-size="21" font-weight="400" fill="#087D83">constructioncapital.co.uk/market-reports</text></svg>